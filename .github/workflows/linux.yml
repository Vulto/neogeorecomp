name: Linux

on:
  push:
    branches:
      - master
      - "work/**"
      - "agent/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make libsdl3-dev

      - name: Simulate stale submodule worktrees
        run: |
          set -eu
          for path in games/neodriftout third_party/z80 third_party/ymfm; do
            rm -rf "$path"
            mkdir -p "$path"
            printf 'stale non-empty worktree\\n' > "$path/.stale"
          done

      - name: Clean build
        run: make clean

      - name: Build with warnings as errors
        run: |
          make CFLAGS="-std=c23 -O2 -Wall -Wextra -Wpedantic -Werror" \
               CXXFLAGS="-std=c++14 -O2 -Wall -Wextra -Wpedantic -Werror"

      - name: Native runtime self-test
        run: make test

      - name: Sanitized runtime self-test
        run: |
          set +e
          make clean
          git -C games/neodriftout checkout -- src/autorecomp
          make CFLAGS="-std=c23 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer" \
               CXXFLAGS="-std=c++14 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer" \
               LDFLAGS="-fsanitize=address,undefined" > sanitizer-build.log 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            echo "Sanitized build failed:" >&2
            tail -n 120 sanitizer-build.log >&2
            exit "$build_status"
          fi
          timeout 120s env ASAN_OPTIONS="detect_leaks=1:halt_on_error=1" \
          UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1" \
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy NEOGEO_HEADLESS=1 \
          ./neodriftout --self-test > sanitizer-test.log 2>&1
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            echo "Sanitized runtime self-test failed:" >&2
            tail -n 200 sanitizer-test.log >&2
            exit "$test_status"
          fi

      - name: Audit decompilation coverage
        run: make decomp-audit

      - name: Package native runtime
        run: |
          mkdir -p dist/lib
          cp neodriftout dist/neodriftout
          cp "$(ldconfig -p | awk '/libSDL3.so.0/{print $NF; exit}')" dist/lib/libSDL3.so.0

      - name: Build portable runtime bundle
        run: |
          set -eu
          rm -rf portable
          mkdir -p portable/rootfs/lib portable/rootfs/lib64
          cp -L dist/neodriftout portable/rootfs/neodriftout
          copy_deps() {
            ldd "$1" | awk '{for (i=1; i<=NF; i++) if ($i ~ /^\//) print $i}' | sort -u
          }
          for lib in $(copy_deps portable/rootfs/neodriftout) $(copy_deps dist/lib/libSDL3.so.0); do
            case "$lib" in /lib*|/usr/lib*)
              rel=${lib#/}
              mkdir -p "portable/rootfs/$(dirname "$rel")"
              cp -L "$lib" "portable/rootfs/$rel"
            ;; esac
          done
          cp -L dist/lib/libSDL3.so.0 portable/rootfs/lib/libSDL3.so.0
          loader=$(readelf -l portable/rootfs/neodriftout | awk '/interpreter/ {gsub(/[\[\]]/, "", $NF); print $NF}')
          if [ -n "$loader" ] && [ -f "$loader" ]; then
            rel=${loader#/}
            mkdir -p "portable/rootfs/$(dirname "$rel")"
            cp -L "$loader" "portable/rootfs/$rel"
          fi
          tar -C portable/rootfs -czf portable/neodriftout-rootfs.tar.gz .

      - name: Upload portable runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: neodriftout-portable-linux
          path: portable/neodriftout-rootfs.tar.gz
          if-no-files-found: error
