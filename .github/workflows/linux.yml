name: Linux

on:
  push:
    branches:
      - master
      - "work/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make libsdl3-dev

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Package native executable
        uses: actions/upload-artifact@v4
        with:
          name: neodriftout-linux
          path: neodriftout
          if-no-files-found: error
