name: Linux

on:
  push:
    branches:
      - master
      - "work/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make libsdl3-dev

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Package native runtime
        run: |
          mkdir -p dist/lib
          cp neodriftout dist/neodriftout
          cp "$(ldconfig -p | awk '/libSDL3.so.0/{print $NF; exit}')" dist/lib/libSDL3.so.0

      - name: Build portable runtime bundle
        run: |
          set -eu
          rm -rf portable
          mkdir -p portable/rootfs
          cp -L dist/neodriftout portable/rootfs/neodriftout
          copy_one() {
            lib=$1
            [ -f "$lib" ] || return 0
            rel=${lib#/}
            target="portable/rootfs/$rel"
            mkdir -p "$(dirname "$target")"
            [ -f "$target" ] || cp -L "$lib" "$target"
          }
          queue="$(ldd portable/rootfs/neodriftout | awk '{for (i=1; i<=NF; i++) if ($i ~ /^\//) print $i}') $(ldd dist/lib/libSDL3.so.0 | awk '{for (i=1; i<=NF; i++) if ($i ~ /^\//) print $i}')"
          seen=""
          while [ -n "$queue" ]; do
            next=""
            for lib in $queue; do
              case " $seen " in *" $lib "*) continue;; esac
              seen="$seen $lib"
              copy_one "$lib"
              deps="$(ldd "$lib" 2>/dev/null | awk '{for (i=1; i<=NF; i++) if ($i ~ /^\//) print $i}' || true)"
              next="$next $deps"
            done
            queue="$(printf '%s\n' $next | sort -u | tr '\n' ' ')"
          done
          mkdir -p portable/rootfs/lib
          cp -L dist/lib/libSDL3.so.0 portable/rootfs/lib/libSDL3.so.0
          tar -C portable/rootfs -czf portable/neodriftout-rootfs.tar.gz .

      - name: Upload portable runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: neodriftout-portable-linux
          path: portable/neodriftout-rootfs.tar.gz
          if-no-files-found: error
